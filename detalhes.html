<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Zona</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header" style="align-items: center;">
        <h3 style="margin: 0;" id="page-title">Carregando Zona...</h3>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="data-source-badge" style="font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: bold;"></span>
            <button style="width: auto; padding: 8px 15px; margin: 0; background: #6c757d;" onclick="window.close()">Fechar Guia</button>
        </div>
    </div>

    <div class="grid-2x2">
        <div class="card">
            <div class="card-header"><div class="zone-title">Temperatura Atual</div></div>
            <div class="temp-value" id="det-temp">-- °C</div>
        </div>
        <div class="card">
            <div class="card-header"><div class="zone-title">Status do Relé</div></div>
            <div class="temp-value" id="det-relay" style="color: var(--text);">--</div>
        </div>
        <div class="card">
            <div class="card-header"><div class="zone-title">Setpoint</div></div>
            <div class="temp-value" id="det-setpoint" style="color: #6c757d;">-- °C</div>
        </div>
        <div class="card">
            <div class="card-header"><div class="zone-title">Histerese</div></div>
            <div class="temp-value" id="det-histerese" style="color: #6c757d;">± -- °C</div>
        </div>
    </div>

    <div class="card" style="margin-top: 15px;">
        <h4 style="margin-top: 0;">Histórico Térmico</h4>
        <canvas id="zoneChart" height="150"></canvas>
    </div>

    <div id="toast">Ação executada</div>

    <script>
        const MOCK_STORAGE_KEY = 'aviary_mock_state';

        // 1. Identifica qual zona foi solicitada pela URL
        const urlParams = new URLSearchParams(window.location.search);
        const zonaId = parseInt(urlParams.get('zona')) || 0;

        document.getElementById('page-title').innerText = `Monitoramento: Zona ${zonaId + 1}`;

        // 2. Configuração do Gráfico
        const ctx = document.getElementById('zoneChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: `Temperatura Zona ${zonaId + 1} (°C)`,
                        data: [],
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3
                    },
                    {
                        label: 'Setpoint (°C)',
                        data: [],
                        borderColor: '#0d6efd',
                        borderDash: [6, 3],
                        backgroundColor: 'transparent',
                        pointRadius: 0,
                        tension: 0
                    }
                ]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: {
                    legend: { display: true }
                }
            }
        });

        // 3. Estado local da zona — sempre mantido em memória e evoluído pela física.
        //    Inicializado a partir do sessionStorage (se disponível) ou com valores padrão.
        let localZona = null;

        function initLocalZona(source) {
            // source pode ser um objeto zona vindo do sessionStorage ou null
            localZona = source ? { ...source } : {
                temp: 26.0, setpoint: 28.0, histerese: 1.0, ativo: true, releEstado: false
            };
        }

        // 4. Aplica um tick da mesma física do mock.js sobre localZona.
        //    Se o sessionStorage trouxer novos parâmetros de controle (setpoint, histerese,
        //    ativo, releEstado em modo manual), absorve-os sem substituir a temperatura
        //    que já está evoluindo localmente.
        function tickFisica(sharedZona) {
            if (!localZona) return;

            // Absorve parâmetros de controle atualizados vindos do index.html
            if (sharedZona) {
                localZona.setpoint   = sharedZona.setpoint;
                localZona.histerese  = sharedZona.histerese;
                localZona.ativo      = sharedZona.ativo;
                // Em modo manual o relé é controlado pelo index; absorve o estado
                if (!sharedZona.ativo) localZona.releEstado = sharedZona.releEstado;
            }

            // Dinâmica de temperatura — mesma fórmula do mock.js
            if (localZona.releEstado) localZona.temp -= (Math.random() * 0.4 + 0.1);
            else                      localZona.temp += (Math.random() * 0.4 + 0.1);

            // Termostato com histerese — mesma lógica do mock.js
            if (localZona.ativo) {
                const inf = localZona.setpoint - localZona.histerese;
                const sup = localZona.setpoint + localZona.histerese;
                if (!localZona.releEstado && localZona.temp >= sup) localZona.releEstado = true;
                else if (localZona.releEstado && localZona.temp <= inf) localZona.releEstado = false;
            }
        }

        // 5. Lê o sessionStorage — retorna o objeto da zona específica ou null
        function readSharedZona() {
            try {
                const raw = sessionStorage.getItem(MOCK_STORAGE_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                return data.zonas?.[zonaId] ?? null;
            } catch (e) {
                return null;
            }
        }

        // Badge de fonte de dados
        let currentSource = null;
        function setBadge(source) {
            if (source === currentSource) return;
            currentSource = source;
            const badge = document.getElementById('data-source-badge');
            if (source === 'shared') {
                badge.innerText = '● Simulação Compartilhada';
                badge.style.background = '#d1e7dd';
                badge.style.color = '#0a3622';
            } else {
                badge.innerText = '⚠ Simulação Isolada';
                badge.style.background = '#fff3cd';
                badge.style.color = '#856404';
            }
        }

        // 5. Atualiza os cards e o gráfico com os dados de uma zona
        function updateUI(zonaData) {
            // Temperatura
            document.getElementById('det-temp').innerText =
                zonaData.temp !== -999 ? `${zonaData.temp.toFixed(1)} °C` : "Erro";

            // Relé
            const relayEl = document.getElementById('det-relay');
            if (zonaData.releEstado) {
                relayEl.innerText = "LIGADO";
                relayEl.style.color = "var(--success)";
            } else {
                relayEl.innerText = "DESLIGADO";
                relayEl.style.color = "var(--danger)";
            }

            // Setpoint e Histerese
            document.getElementById('det-setpoint').innerText =
                zonaData.setpoint !== undefined ? `${zonaData.setpoint.toFixed(1)} °C` : "-- °C";
            document.getElementById('det-histerese').innerText =
                zonaData.histerese !== undefined ? `± ${zonaData.histerese.toFixed(1)} °C` : "± -- °C";

            // Gráfico
            const time = new Date().toLocaleTimeString();
            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(zonaData.temp !== -999 ? zonaData.temp : null);
            chart.data.datasets[1].data.push(zonaData.setpoint ?? null);

            // Mantém os últimos 30 pontos
            if (chart.data.labels.length > 30) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }
            chart.update();
        }

        // 7. Loop principal — roda a física localmente a cada 2s,
        //    absorvendo parâmetros do sessionStorage quando disponíveis.
        setInterval(() => {
            const sharedZona = readSharedZona();

            // Inicializa localZona na primeira execução
            if (!localZona) initLocalZona(sharedZona);

            setBadge(sharedZona ? 'shared' : 'isolated');

            // Evolui a temperatura com a mesma física do mock.js
            tickFisica(sharedZona);

            updateUI(localZona);
        }, 2000);
    </script>
</body>
</html>
